name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: rust:1.95.0-slim-bullseye
    steps:
      - uses: actions/checkout@v4
      - name: Check packaging tools
        run: command -v objdump && command -v dpkg-deb && command -v sha256sum
      - name: Check formatting
        run: rustup component add rustfmt clippy && cargo fmt --check
      - name: Lint and test
        run: cargo clippy --all-targets --locked -- -D warnings && cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        run: sh scripts/package.sh "${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: release-assets
          path: dist/*
